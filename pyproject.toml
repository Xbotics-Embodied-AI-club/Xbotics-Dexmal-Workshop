[project]
name = "xbotics-dexmal-workshop"
version = "0.1.0"
description = "Xbotics × 原力灵机工作坊：DM0.5 策略 + DW0.5 世界模型在 SO-101 上的讲义与环境"
# 3.12 是上游 mani-skill 与 flash-attn 预编译轮子共同支持的版本。
requires-python = ">=3.12,<3.13"

# 分工：dexbotic（模型框架）与 LeRobot（机器人接口）是面向所有人的通用包；本仓放这次工作坊专属的
# 脚本（scripts/：下载、数据转换、控制循环、录像标注、单卡微调、上手演示）和讲义。
# 本仓不打包安装，只声明一个把两个通用包装在一起的环境，脚本直接 `uv run python scripts/...` 运行。
# 一个环境装下训练、推理与仿真：仿真器是 LeRobot 的依赖，随它一起装上（钉版见下方 override）。
# 以下各项钉版都是 dexbotic 自己的声明管不到、但实际运行时一旦松开就出错的地方。
dependencies = [
    "dexbotic",
    # 机器人的硬件接口（HAL）：仿真与真机都走 LeRobot 的 Robot 接口，控制循环只写一份。
    # 只用它的 robots / motors / cameras 三层，不用它的策略与推理服务。
    "lerobot[feetech]",
    # 现场显卡是 RTX 5090（Blackwell，sm_120），需要 CUDA 12.8 的轮子，见下方 index；版本钉在下方 override。
    "torch",
    "torchvision",
    # dexbotic 只给下界；实测 5.15 起 DM0.5 起服务时与 kernels 接口不配套，直接报错。
    "transformers==5.3.0",
    # transformers 5.3.0 自己声明 kernels<0.11；上游只写裸 "kernels"，会解到 0.15。
    "kernels>=0.10.2,<0.11",
    # DM0.5 与 DW0.5 的运行依赖，dexbotic 的依赖表里漏了它们。
    "tyro==1.0.13",
    "liger-kernel",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "python-multipart",
    "imageio",
    "imageio-ffmpeg",
    "rich",
    "termcolor",
    "modelscope",
    # numpy 被钉在 1.26.4（见 override），scipy 1.15 起要求 numpy>=2，装上后一 import 就崩。
    "scipy>=1.13,<1.15",
    # 推理加载权重时，DM0.5 视觉塔按权重里的配置走 flash_attention_2，缺这个包推理服务起不来。
    "flash-attn",
    # 读视频的 decord 换成它的维护分支（导入名同样是 decord，接口相同）：PyPI 上 decord 0.6.0 的 Linux 轮子
    # 内部标签写成 cp36，uv 每次运行都判它与 Python 3.12 不匹配、重装一遍；这一份标签正确。原包在下方排除。
    "eva-decord==0.6.1",
]

[tool.uv]
# 只装依赖，不把本仓当成包安装：scripts/ 下是直接运行的脚本。
package = false
# 三个上游各自的版本上限互相矛盾，全部统一到 DM0.5 实际跑通的那一组：
# - numpy：仿真器与 LeRobot 声明 >=2，dexbotic 钉 1.26.4；
# - torch / torchvision：LeRobot 声明 torch<2.11、torchvision<0.26，DM0.5 钉 torch 2.11。
#   LeRobot 的这两条上限是为它的视频解码（torchcodec）与策略模块设的，硬件接口那几层不受影响。
override-dependencies = [
    "numpy==1.26.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
    # 仿真引擎 sapien 要 opencv-python，LeRobot 要 opencv-python-headless，两个包写的是同一个 cv2 目录；
    # 钉成同一版本，谁后装都是同一份代码。
    "opencv-python==4.13.0.92",
    "opencv-python-headless==4.13.0.92",
    # 仿真器只在这里钉一次：LeRobot 把它当核心依赖却不钉提交（跟着 main 走），dexbotic 另钉了一个，
    # 三处写法不同 uv 就报 URL 冲突；override 让所有依赖方都用这一个提交。
    "so101-sim @ git+https://github.com/Xbotics-Embodied-AI-club/Xbotics-SO101-Sim.git@1510eeec6251b0de6948faff827804706b71eab9",
    # 不装 DeepSpeed：单卡微调用不到它（它只服务多卡全量训练），而它一旦装上，accelerate 构造
    # Trainer 时就会导入它，它在导入时要调用本机 CUDA 工具链里的 nvcc——只装了显卡驱动的机器上直接失败。
    # 标记永远不成立，等于把 dexbotic 声明的这条依赖整条拿掉。
    "deepspeed; sys_platform == 'never'",
    # decord 由上面的 eva-decord 提供（同一个导入名），原包整条拿掉，两个包不同时装。
    "decord; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
dexbotic = { git = "https://github.com/Xbotics-Embodied-AI-club/dexbotic.git", rev = "8f00f67e992c1971587c07846c604948b1773bbf" }
# LeRobot 用 Xbotics 维护的版本，钉提交。
lerobot = { git = "https://github.com/Xbotics-Embodied-AI-club/lerobot.git", rev = "9381726d2a99f1da8f822ab0917246106d6f8d7c" }
# PyPI 上只有源码包，会触发半小时级的本地编译；取社区按 torch / CUDA 版本逐一预编译的轮子。
# 官方 release 最新只到 torch 2.10，且轮子元数据里的版本号不带文件名上的本地标签，uv 每次运行都判它
# 「不是最新」重装一遍；这一份按 torch 2.11 + CUDA 12.8 编译，元数据版本与文件名一致。
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu128torch2.11-cp312-cp312-linux_x86_64.whl" }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["B", "I", "RUF100"]
